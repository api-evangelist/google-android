    title: Quota exceeded / rate limited
    remediation: Back off and retry; request higher quota in the Google Cloud console.
  - status: 500
    canonical: INTERNAL
    title: Internal server error
    remediation: Retry with exponential backoff; contact support if persistent.
  - status: 503
    canonical: UNAVAILABLE
    title: Service unavailable
    remediation: Retry with exponential backoff; check https://status.cloud.google.com/.
