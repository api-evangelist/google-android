    registry: npm
    name: googleapis
    url: https://www.npmjs.com/package/googleapis
    install: npm install googleapis
    official: true
    covers: [android-management-api, google-play-developer-api, google-play-games-services-api, google-play-emm-api, cloud-testing-api, android-device-provisioning-partner-api, play-integrity-api]
  - language: javascript
    registry: npm
    name: firebase-admin
    url: https://www.npmjs.com/package/firebase-admin
    install: npm install firebase-admin
    official: true
    covers: [firebase-cloud-messaging-api]
