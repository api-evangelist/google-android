notes: >-
  Google ships first-party client libraries generated across all its REST APIs
  (Android Management, Google Play Developer, Cloud Testing, EMM, Play Integrity,
  etc.) via the language-specific google-api-* client families. Firebase Cloud
  Messaging is served through the Firebase Admin SDKs. All packages listed are
  published by Google.
packages:
