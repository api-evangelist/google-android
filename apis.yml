  - type: GettingStarted
    url: https://developers.google.com/android/work/play/emm-api/getstarted
- aid: google-android:play-integrity-api
  name: Play Integrity API
  description: >-
    The Play Integrity API helps protect your apps and games from potentially risky and fraudulent interactions
    by checking that interactions and server requests are coming from your genuine app binary running
    on a genuine Android device.
  image: >-
    https://www.gstatic.com/devrel-devsite/prod/v2ff77c87c709f3e5e323c03865ecedf5b4afc4446d0e0e2904abf9d5/android/images/touchicon-180.png
  humanURL: https://developer.android.com/google/play/integrity
  baseURL: https://playintegrity.googleapis.com
  tags:
  - App Verification
  - Fraud Prevention
  - Integrity
  - Security
  properties:
  - type: Documentation
    url: https://developer.android.com/google/play/integrity/overview
  - type: GettingStarted
    url: https://developer.android.com/google/play/integrity/standard
- aid: google-android:cloud-testing-api
  name: Cloud Testing API
  description: >-
    The Cloud Testing API powers Firebase Test Lab, enabling developers to test Android and iOS apps on
    real and virtual devices hosted in Google data centers, including instrumentation tests and robo tests.
  image: https://firebase.google.com/images/social.png
  humanURL: https://firebase.google.com/docs/test-lab
  baseURL: https://testing.googleapis.com
  tags:
