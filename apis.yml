- aid: google-android:android-device-provisioning-partner-api
  name: Android Device Provisioning Partner API
  description: >-
    The Android Device Provisioning Partner API allows device resellers and enterprise mobility management
    providers to programmatically manage zero-touch enrollment for enterprise Android devices, including
    creating customers, claiming devices, and managing device metadata.
  image: >-
    https://www.gstatic.com/devrel-devsite/prod/v2ff77c87c709f3e5e323c03865ecedf5b4afc4446d0e0e2904abf9d5/android/images/touchicon-180.png
  humanURL: https://developers.google.com/zero-touch
  baseURL: https://androiddeviceprovisioning.googleapis.com
  tags:
  - Device Provisioning
  - Enterprise
  - Reseller
  - Zero-Touch Enrollment
  properties:
  - type: Documentation
    url: https://developers.google.com/zero-touch/reference/reseller/rest
  - type: GettingStarted
    url: https://developers.google.com/zero-touch/guides/overview
- aid: google-android:google-play-emm-api
  name: Google Play EMM API
  description: >-
    The Google Play EMM API enables enterprise mobility management providers to manage the distribution
    of Android apps and configurations to enterprise users and devices. This API is no longer accepting
    new registrations but remains available for existing integrations.
  image: >-
    https://www.gstatic.com/devrel-devsite/prod/v2ff77c87c709f3e5e323c03865ecedf5b4afc4446d0e0e2904abf9d5/android/images/touchicon-180.png
